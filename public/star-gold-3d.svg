<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 190" width="200" height="190" role="img" aria-label="Sao vàng 3D">
  <defs>
    <linearGradient id="starFace" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7c2"/>
      <stop offset="0.28" stop-color="#fde047"/>
      <stop offset="0.55" stop-color="#fbbf24"/>
      <stop offset="0.82" stop-color="#f59e0b"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="starSide" x1="0" y1="0" x2="0" y2="1">
